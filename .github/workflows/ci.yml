name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: cargo test --locked
      - run: cargo test --locked --all-targets
      - run: cargo run --locked --example tour

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: rustup default stable
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path tools/perf-probe/Cargo.toml -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --manifest-path tools/perf-probe/Cargo.toml --all-targets -- -D warnings
      - run: cargo check --locked --manifest-path tools/perf-probe/Cargo.toml --all-targets
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo package --locked
      - run: cargo build --locked
      - run: rustdoc --test README.md --edition=2024 --extern prescient=target/debug/libprescient.rlib -L dependency=target/debug/deps
      - run: cargo test --locked --example compare

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.93.0 --profile minimal
      - run: cargo +1.93.0 check --locked --all-targets

  loom:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: cargo test --release --locked loom_ --lib
        env:
          RUSTFLAGS: --cfg loom

  benchmark-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: cargo run --release --locked --example compare -- mpmc-ring 2 2 1000 64 1 --batch 1
      - run: cargo run --release --locked --example async_bench -- 2 1000 64 3 prescient-fixed
      - run: cargo run --release --locked --manifest-path tools/perf-probe/Cargo.toml -- layout
      - run: cargo run --release --locked --manifest-path tools/perf-probe/Cargo.toml -- codegen
      - run: cargo run --release --locked --manifest-path tools/perf-probe/Cargo.toml -- select 1000 1
      - run: cargo run --release --locked --manifest-path tools/perf-probe/Cargo.toml -- ipc_duplex 65536 1
